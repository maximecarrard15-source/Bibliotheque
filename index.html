<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ma Bibliothèque — Gestion de bibliothèques personnelles</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#7c5330">
  <meta name="description" content="Gestion de bibliothèques personnelles : livres, emplacements, prêts et rangement visuel.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a class="brand" href="#/">
        <span class="brand-icon" aria-hidden="true">📚</span>
        <span class="brand-name">Ma Bibliothèque</span>
      </a>
      <div class="header-right">
        <nav class="main-nav" id="main-nav" aria-label="Navigation principale">
          <a href="#/" data-nav="dashboard">Tableau de bord</a>
          <a href="#/bibliotheques" data-nav="libraries">Bibliothèques</a>
          <a href="#/livres" data-nav="books">Livres</a>
        </nav>
        <button id="install-btn" class="btn primary small" type="button" hidden>📲 Installer</button>
      </div>
    </div>
    <div class="search-wrap">
      <div class="search-box" id="search-box">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input type="search" id="global-search"
               placeholder="Rechercher un livre (titre, auteur, genre, type)…"
               autocomplete="off" aria-label="Recherche globale de livres">
        <div class="search-suggestions" id="search-suggestions" hidden></div>
      </div>
    </div>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <footer class="app-footer">
    Sauvegarde automatique locale — vos données restent dans ce navigateur · Sans rechargement de page
  </footer>

  <div id="toast-zone" class="toast-zone" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/modals.js"></script>
  <script src="js/views-dashboard.js"></script>
  <script src="js/views-libraries.js"></script>
  <script src="js/views-books.js"></script>
  <script src="js/views-search.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
